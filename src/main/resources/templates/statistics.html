<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Statistik</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="container mt-4">

<!-- Navbar -->
<div th:replace="fragments/navbar :: body"></div>

<h1 class="mb-4">Statistik</h1>

<div class="row g-4">

    <!-- Einnahmen -->
    <div class="col-md-4">
        <div class="card shadow-sm border-success">
            <div class="card-body">
                <h5 class="card-title text-success">
                    <i class="bi bi-arrow-up-circle-fill"></i> Einnahmen
                </h5>
                <p class="card-text fs-3 fw-bold" th:text="${income} + ' €'"></p>
            </div>
        </div>
    </div>

    <!-- Ausgaben -->
    <div class="col-md-4">
        <div class="card shadow-sm border-danger">
            <div class="card-body">
                <h5 class="card-title text-danger">
                    <i class="bi bi-arrow-down-circle-fill"></i> Ausgaben
                </h5>
                <p class="card-text fs-3 fw-bold" th:text="${expense} + ' €'"></p>
            </div>
        </div>
    </div>

    <!-- Kontostand -->
    <div class="col-md-4">
        <div class="card shadow-sm border-primary">
            <div class="card-body">
                <h5 class="card-title text-primary">
                    <i class="bi bi-wallet2"></i> Kontostand
                </h5>
                <p class="card-text fs-3 fw-bold"
                   th:text="${balance} + ' €'"
                   th:classappend="${balance >= 0} ? 'text-success' : 'text-danger'">
                </p>
            </div>
        </div>
    </div>

</div>

<!-- Buttons -->
<div class="mt-4">
    <a th:href="@{/transactions}" class="btn btn-secondary">Zurück zu den Buchungen</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
