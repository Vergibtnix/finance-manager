<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Statistik</title>
    <script th:src="@{/js/theme.js}"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body class="container mt-4">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: body}"></div>

<h1 class="mb-4">Statistik</h1>

<p class="text-muted">Hier findest du Gesamtwerte sowie tägliche, wöchentliche und monatliche Berichte.</p>

<div class="row g-4">

    <!-- Einnahmen -->
    <div class="col-md-4">
        <div class="card shadow-sm border-success">
            <div class="card-body">
                <h5 class="card-title text-success">
                    <i class="bi bi-arrow-up-circle-fill"></i> Einnahmen
                </h5>
                <p class="card-text fs-3 fw-bold" th:text="${#numbers.formatDecimal(income, 1, 'POINT', 2, 'COMMA')} + ' €'"></p>
            </div>
        </div>
    </div>

    <!-- Ausgaben -->
    <div class="col-md-4">
        <div class="card shadow-sm border-danger">
            <div class="card-body">
                <h5 class="card-title text-danger">
                    <i class="bi bi-arrow-down-circle-fill"></i> Ausgaben
                </h5>
                <p class="card-text fs-3 fw-bold" th:text="${#numbers.formatDecimal(expense, 1, 'POINT', 2, 'COMMA')} + ' €'"></p>
            </div>
        </div>
    </div>

    <!-- Kontostand -->
    <div class="col-md-4">
        <div class="card shadow-sm border-primary">
            <div class="card-body">
                <h5 class="card-title text-primary">
                    <i class="bi bi-wallet2"></i> Kontostand
                </h5>
                <p class="card-text fs-3 fw-bold"
                   th:text="${#numbers.formatDecimal(balance, 1, 'POINT', 2, 'COMMA')} + ' €'"
                   th:classappend="${balance.signum() >= 0} ? 'text-success' : 'text-danger'">
                </p>
            </div>
        </div>
    </div>

</div>

<section class="mt-5">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <h2 class="h4 mb-0">Berichte</h2>
        <a th:href="@{/statistics/monthly}" class="btn btn-outline-primary btn-sm">Detaillierte Monatsauswertung</a>
    </div>

    <div class="row g-4">
        <div class="col-lg-4" th:each="report : ${reports}">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h3 class="h5 card-title" th:text="${report.label}">Bericht</h3>
                    <p class="text-muted mb-4" th:text="${report.periodText}">Zeitraum</p>

                    <dl class="row mb-0">
                        <dt class="col-6 text-success">Einnahmen</dt>
                        <dd class="col-6 text-end"
                            th:text="${#numbers.formatDecimal(report.income, 1, 'POINT', 2, 'COMMA')} + ' €'">0,00 €</dd>

                        <dt class="col-6 text-danger">Ausgaben</dt>
                        <dd class="col-6 text-end"
                            th:text="${#numbers.formatDecimal(report.expense, 1, 'POINT', 2, 'COMMA')} + ' €'">0,00 €</dd>

                        <dt class="col-6 fw-bold">Saldo</dt>
                        <dd class="col-6 text-end fw-bold"
                            th:text="${#numbers.formatDecimal(report.balance, 1, 'POINT', 2, 'COMMA')} + ' €'"
                            th:classappend="${report.balance.signum() >= 0} ? ' text-success' : ' text-danger'">0,00 €</dd>
                    </dl>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Buttons -->
<div class="mt-4">
    <a th:href="@{/transactions}" class="btn btn-secondary">Zurück zu den Buchungen</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
