<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrierung</title>
    <script th:src="@{/js/theme.js}"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="container mt-4">
<div th:replace="~{fragments/navbar :: body}"></div>

<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm p-4">
            <h1 class="h3 mb-4 text-center">Registrierung</h1>

            <form th:action="@{/register}" th:object="${registrationForm}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Benutzername</label>
                    <input id="username" type="text" th:field="*{username}" class="form-control" autocomplete="username" required>
                    <div class="text-danger mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Passwort</label>
                    <input id="password" type="password" th:field="*{password}" class="form-control" autocomplete="new-password" required>
                    <div class="text-danger mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Passwort bestätigen</label>
                    <input id="confirmPassword" type="password" th:field="*{confirmPassword}" class="form-control" autocomplete="new-password" required>
                    <div class="text-danger mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                    <div class="text-danger mt-1" th:if="${#fields.hasErrors('passwordConfirmed')}" th:errors="*{passwordConfirmed}"></div>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Konto erstellen</button>
                    <a th:href="@{/login}" class="btn btn-outline-secondary">Bereits registriert? Zum Login</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
