<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Monatsstatistik</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="container mt-4">

<!-- Navbar -->
<div th:replace="fragments/navbar :: body"></div>

<h1 class="mb-4">Monatsstatistik</h1>

<!-- Monat / Jahr Auswahl -->
<form class="row g-3 mb-4" method="get" th:action="@{/statistics/monthly}">
  <div class="col-md-3">
    <label class="form-label">Jahr</label>
    <input type="number" class="form-control" name="year" th:value="${year}">
  </div>

  <div class="col-md-3">
    <label class="form-label">Monat</label>
    <select class="form-select" name="month" th:value="${month}">
      <option th:value="1">Januar</option>
      <option th:value="2">Februar</option>
      <option th:value="3">März</option>
      <option th:value="4">April</option>
      <option th:value="5">Mai</option>
      <option th:value="6">Juni</option>
      <option th:value="7">Juli</option>
      <option th:value="8">August</option>
      <option th:value="9">September</option>
      <option th:value="10">Oktober</option>
      <option th:value="11">November</option>
      <option th:value="12">Dezember</option>
    </select>
  </div>

  <div class="col-md-3 align-self-end">
    <button type="submit" class="btn btn-primary">Anzeigen</button>
  </div>
</form>

<!-- Statistik Cards -->
<div class="row g-4">

  <!-- Einnahmen -->
  <div class="col-md-4">
    <div class="card shadow-sm border-success">
      <div class="card-body">
        <h5 class="card-title text-success">
          <i class="bi bi-arrow-up-circle-fill"></i> Einnahmen
        </h5>
        <p class="fs-3 fw-bold" th:text="${income} + ' €'"></p>
      </div>
    </div>
  </div>

  <!-- Ausgaben -->
  <div class="col-md-4">
    <div class="card shadow-sm border-danger">
      <div class="card-body">
        <h5 class="card-title text-danger">
          <i class="bi bi-arrow-down-circle-fill"></i> Ausgaben
        </h5>
        <p class="fs-3 fw-bold" th:text="${expense} + ' €'"></p>
      </div>
    </div>
  </div>

  <!-- Saldo -->
  <div class="col-md-4">
    <div class="card shadow-sm border-primary">
      <div class="card-body">
        <h5 class="card-title text-primary">
          <i class="bi bi-wallet2"></i> Saldo
        </h5>
        <p class="fs-3 fw-bold"
           th:text="${balance} + ' €'"
           th:classappend="${balance >= 0} ? 'text-success' : 'text-danger'">
        </p>
      </div>
    </div>
  </div>

</div>

<!-- Zurück -->
<a th:href="@{/statistics}" class="btn btn-secondary mt-4">Zur Gesamtstatistik</a>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
