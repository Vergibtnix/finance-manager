<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Neue Buchung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<div th:replace="fragments/navbar :: body"></div>


<h1 class="mb-4">Neue Buchung</h1>

<form th:action="@{/transactions}" th:object="${transaction}" method="post" class="card p-4 shadow-sm">

    <div class="mb-3">
        <label for="date" class="form-label">Datum</label>
        <input type="date" id="date" th:field="*{date}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Betrag</label>
        <input type="number" step="0.01" th:field="*{amount}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Typ</label>
        <select th:field="*{type}" class="form-select">
            <option value="EINNAHME">Einnahme</option>
            <option value="AUSGABE">Ausgabe</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Kategorie</label>
        <select th:field="*{category}" class="form-select">
            <option value="Gehalt">Gehalt</option>
            <option value="Lebensmittel">Lebensmittel</option>
            <option value="Miete">Miete</option>
            <option value="KFZ-Kosten">KFZ-Kosten</option>
            <option value="Freizeit">Freizeit</option>
            <option value="Gesundheit">Gesundheit</option>
            <option value="Sonstiges">Sonstiges</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Beschreibung</label>
        <input type="text" th:field="*{description}" class="form-control">
    </div>

    <button type="submit" class="btn btn-primary">Speichern</button>
    <a th:href="@{/transactions}" class="btn btn-secondary ms-2">Zurück</a>
</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
