<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${page == 'edit'} ? 'Buchung bearbeiten' : 'Neue Buchung'">Neue Buchung</title>
    <script th:src="@{/js/theme.js}"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="container mt-4">
<div th:replace="~{fragments/navbar :: body}"></div>


<h1 class="mb-4" th:text="${page == 'edit'} ? 'Buchung bearbeiten' : 'Neue Buchung'">Neue Buchung</h1>

<form th:action="@{/transactions}" th:object="${transaction}" method="post" class="card p-4 shadow-sm">

    <input type="hidden" th:field="*{id}">

    <div class="mb-3">
        <label for="date" class="form-label">Datum</label>
        <input type="date" id="date" th:field="*{date}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label for="amount" class="form-label">Betrag</label>
        <input type="number" step="0.01" id="amount" th:field="*{amount}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label for="type" class="form-label">Typ</label>
        <select id="type" th:field="*{type}" class="form-select">
            <option value="EINNAHME">Einnahme</option>
            <option value="AUSGABE">Ausgabe</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="category" class="form-label">Kategorie</label>
        <input id="category" th:field="*{category}" class="form-control" list="categorySuggestions"
               placeholder="z. B. Gehalt, Vermietung, Miete, Lebensmittel" required>
        <datalist id="categorySuggestions">
            <option th:each="entry : ${categorySuggestions}" th:value="${entry.key}"></option>
        </datalist>
        <div class="form-text">Du kannst eine bestehende Kategorie wählen oder eine eigene eingeben.</div>
    </div>

    <div class="mb-3">
        <label for="categoryColor" class="form-label">Kategoriefarbe</label>
        <div class="d-flex align-items-center gap-3 flex-wrap">
            <input type="color" id="categoryColor" th:field="*{categoryColor}" class="form-control form-control-color"
                   title="Farbe der Kategorie wählen">
            <span class="badge rounded-pill text-bg-light border px-3 py-2 category-preview">
                Vorschau
            </span>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Schnellauswahl Kategorien</label>
        <div class="d-flex flex-wrap gap-2">
            <button type="button"
                    class="btn btn-sm category-suggestion"
                    th:each="entry : ${categorySuggestions}"
                    th:attr="data-category=${entry.key},data-color=${entry.value}"
                    th:style="'background-color:' + ${entry.value} + '; color:#fff; border-color:' + ${entry.value} + ';'"
                    th:text="${entry.key}">
                Kategorie
            </button>
        </div>
    </div>

    <div class="mb-3">
        <label for="description" class="form-label">Beschreibung</label>
        <input type="text" id="description" th:field="*{description}" class="form-control">
    </div>

    <div class="d-flex gap-2 flex-wrap">
        <button type="submit" class="btn btn-primary">Speichern</button>
        <a th:href="@{/transactions}" class="btn btn-secondary">Zurück</a>
    </div>
</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    const categoryInput = document.getElementById('category');
    const colorInput = document.getElementById('categoryColor');
    const preview = document.querySelector('.category-preview');
    const suggestions = document.querySelectorAll('.category-suggestion');

    const updatePreview = () => {
        preview.style.backgroundColor = colorInput.value;
        preview.style.color = '#ffffff';
        preview.textContent = categoryInput.value || 'Vorschau';
    };

    suggestions.forEach((button) => {
        button.addEventListener('click', () => {
            categoryInput.value = button.dataset.category;
            colorInput.value = button.dataset.color;
            updatePreview();
        });
    });

    categoryInput.addEventListener('input', updatePreview);
    colorInput.addEventListener('input', updatePreview);
    updatePreview();
</script>
</body>
</html>
