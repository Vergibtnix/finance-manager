<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary border rounded-3 shadow-sm mb-4 app-navbar">
    <div class="container-fluid">

        <a class="navbar-brand" th:href="@{/transactions}">Finance Manager</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav me-auto" th:if="${isAuthenticated}">

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"
                       th:classappend="${page}=='home' ? ' active' : ''">
                        Startseite
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/transactions}"
                       th:classappend="${page}=='list' ? ' active' : ''">
                        Buchungen
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/transactions/new}"
                       th:classappend="${page}=='new' ? ' active' : ''">
                        Neue Buchung
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/statistics}"
                       th:classappend="${page}=='stats' ? ' active' : ''">
                        Statistik
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/statistics/monthly}"
                       th:classappend="${page}=='monthly-stats' ? ' active' : ''">
                        Monatsstatistik
                    </a>
                </li>


            </ul>

            <div class="d-flex align-items-center gap-2 flex-wrap justify-content-end">
                <span class="navbar-text" th:if="${isAuthenticated}">
                    Angemeldet als <strong th:text="${currentUsername}">user</strong>
                </span>

                <a class="btn btn-outline-primary" th:if="${!isAuthenticated}" th:href="@{/login}">
                    Login
                </a>

                <a class="btn btn-primary" th:if="${!isAuthenticated}" th:href="@{/register}">
                    Registrieren
                </a>

                <form th:if="${isAuthenticated}" th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-danger">Logout</button>
                </form>

                <button class="btn btn-outline-secondary theme-toggle" type="button" id="theme-toggle"
                        aria-label="Dark Mode umschalten">
                    <span id="theme-toggle-label">🌙 Dark Mode</span>
                </button>
            </div>

        </div>
    </div>
</nav>

</body>
</html>
