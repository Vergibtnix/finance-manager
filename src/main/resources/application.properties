spring.application.name=finance-manager
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/finance_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:finance_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:finance_password}
spring.datasource.driver-class-name=org.postgresql.Driver

server.port=8087

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always

